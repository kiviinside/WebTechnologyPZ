<!DOCTYPE html>
<html>
<head>
    <title>Практическая №10.2</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
<section class="expert">

        <img src="icon.png" alt="icon">

    <h2 class="expert__title">Расскажите о своём опыте</h2>

    <div class="expert__form-container">

            <label class="expert__label">

            </label>
        </div>

        <div class="expert__form-wrap">
            <label class="expert__label">
                <input type="checkbox" class="expert__checkbox"> Webpack
            </label>
            <label class="expert__label">
                <input type="checkbox" class="expert__checkbox" checked> jQuery
            </label>
            <label class="expert__label">
