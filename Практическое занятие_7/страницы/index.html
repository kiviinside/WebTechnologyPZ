<!DOCTYPE html>
<html>
<head>
    <title>input и textarea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" method="get">
        <input type="text" placeholder="Плейсхолдер">
        <input type="text" value="Value">
        <input type="text" disabled class="disabled" placeholder="disabled">
        <input type="password" value="22222222">
        <textarea placeholder="Введите текст"></textarea>
        <input type="button" value="Кнопка через тег input">
        <button type="submit">Кнопка через тег button</button>
    </form>
    <form action="" method="GET">
        <input type="text" placeholder="Плейсхолдер">
        <label for="myInput">Это метка для инпута - нажмите на меня - и инпут получит фокус!</label>
        <button type="submit">Отправить на сервер</button>
    </form>
    <form action="" method="get">
        <input type="checkbox" value="">
    </form>
</body>
</html>
