<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Форма регистрации</h2>
        <div class="form-group">
            <label for="fio">ФИО</label>
            <input type="text" id="fio" name="fio">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="phone">Номер телефона</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <div class="form-group">
            <label for="city">Город</label>
            <input type="text" id="city" name="city">
        </div>
        <div class="form-group">
            <label for="birthdate">Дата рождения</label>
            <input type="date" id="birthdate" name="birthdate">
        </div>

        <h2>Параметры доставки</h2>
        <div class="form-group">
            <label for="address">Адрес</label>
            <textarea id="address" name="address"></textarea>
        </div>
        <div class="form-group">
            <label for="postal-code">Почтовый индекс</label>
            <input type="text" id="postal-code" name="postal-code">
        </div>

        <h2>Предпочитаемый способ получения уведомлений</h2>
        <div class="notification-options">
            <label>
                <input type="radio" name="notification" value="email" checked> По Email
            </label>
            <label>
                <input type="radio" name="notification" value="phone"> По телефону
            </label>
            <label>
                <input type="radio" name="notification" value="none"> Не уведомлять меня
            </label>
        </div>

        <button class="submit-button">ОТПРАВИТЬ ДАННЫЕ</button>
    </div>
</body>
</html>
