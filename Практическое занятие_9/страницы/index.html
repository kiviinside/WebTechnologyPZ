<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическое занятие №9: Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="flex-container direction-row">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="flex-container justify-between">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="flex-container align-baseline">
        <div class="item" style="height: 40px;"></div>
        <div class="item" style="height: 80px;"></div>
        <div class="item" style="height: 60px;"></div>
    </div>

    <div class="flex-container align-self-container">
        <div class="item self-start"></div>
        <div class="item self-center"></div>
        <div class="item self-end"></div>
    </div>

    <div class="flex-container wrap-content">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
