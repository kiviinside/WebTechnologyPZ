<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практическое занятие №9: Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex-container direction-row">
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="flex-container direction-row-reverse">
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <div class="flex-container direction-column">
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <div class="flex-container direction-column-reverse">
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="flex-container direction-row" style="align-items: center;">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="flex-container direction-column" style="align-items: center;">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="flex-container justify-between">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <div class="flex-container justify-around">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <div class="flex-container justify-evenly">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

    <div class="flex-container align-baseline">
        <div class="item-text" style="font-size: 11pt;">JavaScript</div>
        <div class="item-text" style="font-size: 20pt;">CSS</div>
        <div class="item-text" style="font-size: 40pt;">HTML</div>
    </div>

    <div class="flex-container align-self-container">
        <div class="item self-end"></div>
        <div class="item self-end"></div>
        <div class="item self-center"></div>
        <div class="item self-start"></div>
        <div class="item self-start"></div>
    </div>

    <div class="flex-container wrap-content">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>

</body>
</html>
